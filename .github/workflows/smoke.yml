name: Smoke tests

on:
  push:
    branches: ["main", "chatgpt/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check architecture.js
          node --check compose-pro.js
          node --check explanations-pro.js
          node --check generate-pro.js
      - name: Run generator smoke tests
        run: node tests/compose-smoke.js
